schema_version: 1
project:
  id: formflow
  name: FormFlow Pro
  classification: distributed-plugin
  repository: https://github.com/Peanut-Graphic/formflow.git
  lifecycle: active
ownership:
  platform: Peanut Graphic
  deployment: Peanut Graphic
  rollback: Peanut Graphic
environments:
  - name: distribution
    kind: production
    provider: GitHub Releases and Peanut License Server
    url: "https://github.com/Peanut-Graphic/formflow/releases"
  - name: central-first-party-install
    kind: production
    provider: peanutgraphic.com shared WordPress hosting
    url: "https://peanutgraphic.com"
runtimes:
  - name: php
    baseline: WordPress compatibility matrix
    declarations:
      - { scope: dependency, source: formflow.php, value: "Requires PHP 8.2" }
      - { scope: documentation, source: README.md, value: "Requires PHP 8.2+" }
      - { scope: dependency, source: composer.json, value: "require >=8.2; platform 8.2.0" }
      - { scope: ci, source: .github/workflows/tests.yml, value: "required PHP 8.2 minimum property/regression lane and PHP 8.3 current lane" }
      - { scope: ci, source: .github/workflows/wp-contract.yml, value: "PHP 8.4" }
      - { scope: ci, source: .github/workflows/accessibility.yml, value: "PHP 8.4" }
    production_observation: { status: verified, value: "PHP 8.5.9 on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only host interpreter and active-plugin inventory" }
  - name: node
    baseline: "22.22.2 with npm 10.9.7"
    declarations:
      - { scope: dependency, source: package.json and package-lock.json, value: "Node 22.22.2; npm 10.9.7; npm package manager and empty dependency graph locked; stale package version 2.8.6 remains a release-identity exception" }
      - { scope: development, source: .nvmrc, value: "22.22.2" }
      - { scope: ci, source: .github/workflows/accessibility.yml, value: "Node 22.22.2 with npm 10.9.7 assertion" }
      - { scope: test, source: scripts/verify-runtime-contract.cjs, value: "Node, npm, version file, package metadata, lockfile, and CI declarations must remain internally consistent" }
    production_observation: { status: not-applicable }
  - name: wordpress
    baseline: WordPress 6.0+
    declarations:
      - { scope: dependency, source: formflow.php, value: "Requires at least 6.0" }
      - { scope: test, source: .github/workflows/wp-contract.yml, value: "WordPress latest" }
      - { scope: release, source: Peanut License Server /updates/check, value: "requires 6.0; tested 6.4" }
    production_observation: { status: verified, value: "WordPress 6.9.7 on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only WP-CLI core-version and active-plugin inventory" }
databases:
  - name: host-database
    role: transactional
    baseline: Host MySQL or MariaDB compatibility
    declarations:
      - { scope: dependency, source: includes/class-activator.php, value: "WordPress dbDelta plus versioned INFORMATION_SCHEMA and ALTER TABLE migrations on activation and plugin-version drift" }
      - { scope: ci, source: .github/workflows/wp-contract.yml, value: "mysql:8 compatibility and mariadb:10.6 production-family real WordPress REST/schema contract lanes" }
    production_equivalent_test: "yes"
    production_observation: { status: verified, value: "MariaDB 10.6.27, latin1_swedish_ci server collation, SQL mode ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION on the central first-party installation; distributed client hosts unverified", observed_at: "2026-08-15T01:09:00-04:00", evidence: "read-only database metadata query; no application rows read" }
services:
  - kind: other
    baseline: Peanut License Server for licensing and entitlement-gated signed updates
    declarations:
      - { scope: dependency, source: includes/class-license-manager.php, value: "license validation and activation at https://peanutgraphic.com/wp-json/peanut-api/v1" }
      - { scope: dependency, source: includes/class-updater.php, value: "update metadata and package distribution from the same API" }
    production_observation: { status: unverified }
  - kind: other
    baseline: Instance-configured external utility integrations
    declarations:
      - { scope: dependency, source: connectors/intellisource and connectors/powerportal-json, value: "HTTPS enrollment, validation, scheduling, and portal handoff APIs" }
      - { scope: dependency, source: connectors/sftp/class-sftp-destination.php, value: "SFTP submission delivery with password or SSH-key authentication" }
    production_observation: { status: unverified }
distribution:
  mode: signed-github-release
  source_of_truth: Peanut Meta scripts/publish-plugin.sh
  versioned_artifact: "yes"
  signed: "yes"
  canary: "yes"
  rollback: unknown
exceptions:
  - id: PAR-306
    concern: Distributed client database versions, collations, and SQL modes remain unverified
    reason: Real WordPress contracts now exercise MySQL 8 and the central installation's MariaDB 10.6 family, including on-demand dbDelta table creation. Distributed client-host versions, collations, SQL modes, and sequential historical upgrades remain unknown.
    risk: A client-specific legacy engine, strict mode, collation, or multi-version upgrade path can still expose DDL, ENUM, index, or migration behavior outside the two CI lanes.
    owner: Peanut Graphic
    verification: Keep both real-WordPress lanes green; inventory supported client database contracts and add sanitized sequential-upgrade fixtures for each retained family.
    review_date: "2026-11-14"
    status: accepted
  - id: PAR-405
    concern: Release metadata, verification gates, and rollback evidence drift
    reason: The plugin and signed release are 4.2.0 while package.json reports 2.8.6. The live update endpoint serves Peanut Suite description, installation, changelog, and FAQ content for FormFlow. Composer audit remains non-blocking, legacy unit and integration suites are non-blocking, and the publisher has no rollback assertion.
    risk: Operators and clients receive misleading product metadata, release-critical failures can be advisory only, and an update incident has no source-verifiable rollback control.
    owner: Peanut Graphic
    verification: Establish one version and product-metadata source, promote release-critical dependency and test gates after repairing known debt, and add a tested rollback check to the canonical publisher.
    review_date: "2026-11-14"
    status: proposed
verification:
  status: live-verified
  audited_commit: a4b182c04583d7ffccf86f66cfa19cdd55f36322
  last_reviewed: "2026-08-15"
  sources:
    - formflow.php
    - composer.json
    - package.json
    - package-lock.json
    - .nvmrc
    - includes/class-activator.php
    - includes/class-license-manager.php
    - includes/class-updater.php
    - connectors/intellisource
    - connectors/powerportal-json
    - connectors/sftp
    - .github/workflows/tests.yml
    - .github/workflows/accessibility.yml
    - scripts/verify-runtime-contract.cjs
    - .github/workflows/wp-contract.yml
    - Peanut-Graphic/peanut-meta:scripts/publish-plugin.sh
    - Peanut-Graphic/peanut-meta:scripts/verify-plugin-release.sh
    - GitHub Release v4.2.0 assets and signed manifest
    - Peanut License Server /updates/check and /updates/info responses for formflow
    - Read-only central first-party PHP, WordPress, active-plugin, MariaDB version, collation, and SQL-mode metadata on 2026-08-15
  outstanding:
    - Inventory supported distributed client-host PHP, WordPress, database version, collation, and SQL-mode compatibility without collecting customer data.
    - Inventory supported distributed-client database contracts and add sanitized sequential-upgrade fixtures for each retained family under PAR-306/PAR-309.
    - Reconcile versions, product metadata, blocking release gates, and rollback under PAR-405.
