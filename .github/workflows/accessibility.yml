name: Accessibility

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'admin/**'
      - 'public/**'
      - 'includes/**'
      - 'formflow/**'
      - 'tests/accessibility/**'
      - '.github/workflows/accessibility.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'scripts/accessibility-scan.cjs'
      - 'scripts/verify-runtime-contract.cjs'
  push:
    branches:
      - main
    paths:
      - 'admin/**'
      - 'public/**'
      - 'includes/**'
      - 'formflow/**'
      - 'tests/accessibility/**'
      - '.github/workflows/accessibility.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - 'scripts/verify-runtime-contract.cjs'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  accessibility:
    name: Accessibility Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
          cache: 'npm'

      - name: Verify Node/npm contract
        run: test "$(npm --version)" = "10.9.7" && npm run runtime:verify

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run accessibility linting on PHP templates
        run: bash scripts/a11y-check.sh

      - name: Run accessibility unit tests
        run: |
          if [ -d "tests/accessibility" ] && [ -f "phpunit.xml" ]; then
            composer test -- --testsuite=accessibility
          fi

      - name: Run accessibility integration tests
        run: |
          if [ -d "tests/accessibility" ] && [ -f "phpunit.xml" ]; then
            composer test -- --filter=Accessibility
          fi

      - name: Comment on PR with results
        continue-on-error: true
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            try {
              // Run the accessibility scan and capture output
              const output = execSync('node scripts/accessibility-scan.cjs 2>&1', {
                encoding: 'utf-8',
                stdio: ['pipe', 'pipe', 'pipe']
              });

              // Parse critical issues from output
              const hasErrors = output.includes('Errors');
              const errorCount = (output.match(/error/gi) || []).length;

              // Create PR comment
              const comment = `## Accessibility Scan Results

              ${hasErrors ? '⚠️ **Critical issues found**' : '✅ **No critical issues found**'}

              <details>
              <summary>View full scan output</summary>

              \`\`\`
              ${output.substring(0, 2000)}${output.length > 2000 ? '...' : ''}
              \`\`\`

              </details>

              For more details, run locally: \`bash scripts/a11y-check.sh\`
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Scan output:', error.message);
            }
