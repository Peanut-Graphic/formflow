# Peanut Testing Protocol v2 — FormFlow (Pro) test + security gate.
#
# Layered "nets" enforced here:
#   Net 2 (security)  — composer audit (BLOCKING as of 2026-08-20)
#                       + gitleaks secret scan; fail-fast on the job.
#   Net 6 (property)  — tests/Property  (pure, WordPress-free invariants).
#   CLASS-007         — semgrep PHP foot-gun gate (BLOCKING) from the #38 sweep.
#
# Blocking gate = static-and-security + class-007 + property + regression.
# The Unit suite is blocking. Integration remains non-blocking until its WordPress
# infrastructure is wired; that separate gap is tracked in known-gaps.md.
#
# PHP is pinned to 8.3 (the ecosystem CI baseline). The local dev toolchain runs
# PHP 8.5, where ReflectionMethod::setAccessible() emits a deprecation that trips
# beStrictAboutOutputDuringTests — that noise does not occur on 8.3.
#
# The trigger intentionally fires on every PR (no path filter): the testing gate
# must never be skipped just because a change touched only test files or config.
name: tests

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  class-007:
    name: Static Analysis / Security (CLASS-007)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install semgrep
        run: pip install --quiet semgrep

      # CLASS-007 foot-gun gate. The repo is clean (0 findings); this step is
      # BLOCKING so any newly-introduced empty()-coercion on superglobal input
      # or negative-length substr fails CI. Intentional exceptions must carry a
      # `// nosemgrep: <rule-id>` annotation with justification.
      - name: Semgrep PHP foot-gun rules (CLASS-007)
        run: semgrep --config .peanut/static-rules/peanut-php-footguns.yml includes/ public/ --error

  static-and-security:
    name: Static + Security (Net 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Verify declared PHP support
        run: php scripts/verify-php-runtime.php

      # Net 2: dependency vulnerability audits are blocking.
      - name: Verify Composer audit transport contract
        run: bash scripts/tests/composer-audit-transport.test.sh

      - name: Dependency audit (composer audit)
        run: bash scripts/run-dependency-audit-transport.sh composer

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked Python auditor
        run: |
          python -m venv "$RUNNER_TEMP/dependency-audit-venv"
          "$RUNNER_TEMP/dependency-audit-venv/bin/python" -m pip install \
            --require-hashes \
            --no-deps \
            -r requirements-dependency-audit.lock

      - name: Validate dependency-audit transport contract
        run: |
          bash scripts/tests/dependency-audit-transport.test.sh
          bash scripts/tests/dependency-audit-workflow.test.sh
          bash scripts/tests/wp-contract-image-pins.test.sh

      - name: Audit the locked Python auditor
        run: |
          bash "$GITHUB_WORKSPACE/scripts/run-pip-audit.sh" "$RUNNER_TEMP/dependency-audit-venv/bin/pip-audit" -r requirements-dependency-audit.lock --no-deps --disable-pip

      - name: Audit the locked platform validator
        run: |
          bash "$GITHUB_WORKSPACE/scripts/run-pip-audit.sh" "$RUNNER_TEMP/dependency-audit-venv/bin/pip-audit" -r .peanut/platform/requirements.lock --no-deps --disable-pip

      # Net 2: secret scan. This one IS fail-fast — a committed secret should
      # block the merge. The local installer verifies the exact upstream asset
      # digest; no action wrapper or network-time `latest` lookup is trusted.
      - name: Secret scan (gitleaks)
        uses: ./.github/actions/install-gitleaks

      - name: Scan for secrets (blocking)
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --verbose \
            --redact \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks.sarif" \
            --source .

  php-tests:
    name: Property + Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Net 6 — the blocking gate. These suites are pure / WordPress-free
      # and must stay green.
      - name: Property tests (Net 6)
        run: vendor/bin/phpunit --testsuite=property

      - name: Regression tests
        run: vendor/bin/phpunit --testsuite=regression

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite=unit

      - name: Integration tests (non-blocking until infra wired)
        continue-on-error: true
        run: vendor/bin/phpunit --testsuite=integration

  php-minimum-tests:
    name: Property + Regression (PHP 8.2 minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup declared minimum PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
          coverage: none
          tools: composer

      - name: Install dependencies from the lockfile
        run: composer install --no-interaction --prefer-dist

      - name: Verify declared PHP support
        run: php scripts/verify-php-runtime.php --expect-runtime=8.2

      - name: Property tests (Net 6)
        run: vendor/bin/phpunit --testsuite=property

      - name: Regression tests
        run: vendor/bin/phpunit --testsuite=regression

  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # nothing published. It proves the artifact the publisher WOULD build is
      # coherent -- version constants that agree, every INCLUDE path present,
      # vendor/ shipped so the bundled signature verifier reaches the site, a
      # changelog entry for this version.
      #
      # The checker is synced here from peanut-meta by configs-sync, so this
      # job needs no credentials to reach that private repo. Drift is reported
      # by configs-sync itself and surfaced in the weekly audit; see
      # docs/plugin-release-readiness.md there. PAR-406.
      - name: Could this be released at all?
        run: bash .peanut/release/verify-release-readiness.sh formflow
